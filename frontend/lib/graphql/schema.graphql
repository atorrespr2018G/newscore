type Query {
  homepageFeed(market: String!, town: String, regionCode: String, pageName: String): HomepageFeed!
  articleBySlug(slug: String!, market: String!): Article
  breakingNews(market: String!): JSON
  categoryArticles(
    slug: String!
    page: Int!
    pageSize: Int!
    market: String
    regionCode: String
  ): ArticleConnection!
  pageArchiveArticles(
    page: Int!
    pageSize: Int!
    pageName: String
    positionKey: String
  ): ArticleConnection!
}

type ArticleConnection {
  items: [Article!]!
  total: Int!
  page: Int!
  pageSize: Int!
  hasMore: Boolean!
}

type AdPlacement {
  adType: String!
  location: String!
  enabled: Boolean!
  anchorSlug: String
}

type HomepageFeed {
  layoutId: ID
  pageName: String!
  adPlacements: [AdPlacement!]!
  slots: [HomepageSlot!]!
}

type HomepageSlot {
  id: ID!
  positionKey: String!
  displayName: String
  presentationType: String!
  contentType: String!
  articles: [Article!]!
}

type Article {
  id: ID!
  slug: String!
  title: String!
  status: String!
  authorName: String!
  thumbnailUrl: String
  videoUrl: String
  createdAt: String!
  publishedAt: String
  body: String
  tags: [String!]
  categoryId: ID
  storyId: ID
  mediaIds: [String!]
  media: [MediaAsset!]
  viewCount: Int
  storyUpdates: [Article!]
}

type MediaAsset {
  id: ID!
  url: String!
  fileType: String!
  width: Int
  height: Int
}

scalar JSON
