events {}

http {
  client_max_body_size 60m;

  # Docker embedded DNS. Variable proxy_pass re-resolves service names so a
  # rebuilt API container does not leave nginx pointing at a stale IP (502).
  resolver 127.0.0.11 valid=10s ipv6=off;

  limit_req_zone $binary_remote_addr zone=graphql_limit:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

  server {
    listen 80;

  # --- API v1 (preferred) ---

    location /api/v1/admin/auth/login {
      limit_req zone=login_limit burst=3 nodelay;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      set $admin_upstream admin_app:5001;
      proxy_pass http://$admin_upstream/auth/login;
    }

    location /api/v1/admin/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      set $admin_upstream admin_app:5001;
      rewrite ^/api/v1/admin/(.*)$ /$1 break;
      proxy_pass http://$admin_upstream;
    }

    location /api/v1/news/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      set $news_upstream news_storage_app:5002;
      rewrite ^/api/v1/news/(.*)$ /$1 break;
      proxy_pass http://$news_upstream;
    }

    location /api/v1/layout/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      set $layout_upstream layout_admin_app:5003;
      rewrite ^/api/v1/layout/(.*)$ /$1 break;
      proxy_pass http://$layout_upstream;
    }

  # --- Legacy unversioned paths (deprecated) ---

    location /api/admin/auth/login {
      limit_req zone=login_limit burst=3 nodelay;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      set $admin_upstream admin_app:5001;
      proxy_pass http://$admin_upstream/auth/login;
    }

    location /api/admin/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      set $admin_upstream admin_app:5001;
      rewrite ^/api/admin/(.*)$ /$1 break;
      proxy_pass http://$admin_upstream;
    }

    location /api/news/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      set $news_upstream news_storage_app:5002;
      rewrite ^/api/news/(.*)$ /$1 break;
      proxy_pass http://$news_upstream;
    }

    location /api/layout/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      set $layout_upstream layout_admin_app:5003;
      rewrite ^/api/layout/(.*)$ /$1 break;
      proxy_pass http://$layout_upstream;
    }

    location /graphql {
      limit_req zone=graphql_limit burst=20 nodelay;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      set $graphql_upstream graphql_router:4000;
      proxy_pass http://$graphql_upstream/graphql;
    }

    location /media/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      set $news_upstream news_storage_app:5002;
      proxy_pass http://$news_upstream/media/;
    }
  }
}
